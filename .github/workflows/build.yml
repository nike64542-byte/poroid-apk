name: 构建 Podroid APK (poroid-apk)

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      application_id:
        description: '应用包名 / applicationId'
        required: false
        default: 'com.excp.podroid'
        type: string
      version_name:
        description: '版本名称（显示在 Android 中）'
        required: false
        default: '1.2.9'
        type: string
      version_code:
        description: '版本号（整数，必须递增）'
        required: false
        default: '33'
        type: string

env:
  KERNEL_REPO: nike64542-byte/poroid-kernel
  ROOTFS_REPO: nike64542-byte/poroid-rootfs
  QEMU_REPO: nike64542-byte/poroid-qemu

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 设置 Android SDK
        run: |
          export ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}
          export PATH=$PATH:$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "build-tools;34.0.0" "platforms;android-34" || true
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV

      - name: 缓存 Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 从 poroid-kernel Release 下载内核
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/
          gh release download latest -R "${KERNEL_REPO}" -p "vmlinuz-virt" \
            --dir app/src/main/assets/ --clobber \
            || echo "警告：无法下载内核，继续（可用已提交产物）"

      - name: 从 poroid-rootfs Release 下载 initramfs + rootfs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/assets/
          gh release download latest -R "${ROOTFS_REPO}" \
            -p "initrd.img" -p "kali-rootfs.squashfs" \
            --dir app/src/main/assets/ --clobber \
            || echo "警告：无法下载系统镜像，继续"

      - name: 从 poroid-qemu Release 下载 QEMU
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p app/src/main/jniLibs/arm64-v8a/
          gh release download latest -R "${QEMU_REPO}" \
            -p "libqemu-system-aarch64.so" -p "libslirp.so" \
            -p "libpodroid-bridge.so" -p "libpodroid-launcher.so" \
            -p "qemu-assets.tar.gz" \
            --dir /tmp/qemu-dl --clobber \
            || echo "警告：无法下载 QEMU，继续"
          # 解包 QEMU 资源（efi-virtio.rom + keymaps）到 assets/qemu/
          if [ -f /tmp/qemu-dl/qemu-assets.tar.gz ]; then
            mkdir -p app/src/main/assets/qemu/
            tar xzf /tmp/qemu-dl/qemu-assets.tar.gz -C app/src/main/assets/qemu/
          fi
          if [ -f /tmp/qemu-dl/libqemu-system-aarch64.so ]; then
            cp /tmp/qemu-dl/libqemu-system-aarch64.so app/src/main/jniLibs/arm64-v8a/
            cp /tmp/qemu-dl/libslirp.so app/src/main/jniLibs/arm64-v8a/
            cp /tmp/qemu-dl/libpodroid-bridge.so app/src/main/jniLibs/arm64-v8a/
            cp /tmp/qemu-dl/libpodroid-launcher.so app/src/main/jniLibs/arm64-v8a/
          fi

      - name: 检查下载的资源
        run: |
          echo "=== assets ==="
          ls -la app/src/main/assets/ 2>/dev/null || echo "无 assets 目录"
          echo "=== jniLibs ==="
          ls -la app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || echo "无 jniLibs 目录"
          [ -f app/src/main/assets/vmlinuz-virt ] || echo "警告：缺少 vmlinuz-virt"
          [ -f app/src/main/assets/initrd.img ]   || echo "警告：缺少 initrd.img"
          [ -f app/src/main/assets/kali-rootfs.squashfs ] || echo "警告：缺少 kali-rootfs.squashfs"
          [ -f app/src/main/jniLibs/arm64-v8a/libqemu-system-aarch64.so ] || echo "警告：缺少 QEMU"

      - name: 构建 APK
        run: |
          if [ -n "${{ secrets.PODROID_KEYSTORE_B64 }}" ]; then
            echo "构建签名 Release APK..."
            ./gradlew :app:assembleRelease \
              -PpodroidApplicationId="${{ github.event.inputs.application_id || 'com.excp.podroid' }}" \
              -PpodroidVersionName="${{ github.event.inputs.version_name || '1.2.9' }}" \
              -PpodroidVersionCode="${{ github.event.inputs.version_code || '33' }}"
          else
            echo "无签名密钥，构建 Debug APK..."
            ./gradlew :app:assembleDebug \
              -PpodroidApplicationId="${{ github.event.inputs.application_id || 'com.excp.podroid' }}" \
              -PpodroidVersionName="${{ github.event.inputs.version_name || '1.2.9' }}" \
              -PpodroidVersionCode="${{ github.event.inputs.version_code || '33' }}"
          fi
        env:
          PODROID_KEYSTORE_B64: ${{ secrets.PODROID_KEYSTORE_B64 }}
          PODROID_KEYSTORE_PASS: ${{ secrets.PODROID_KEYSTORE_PASS }}
          PODROID_KEY_PASS: ${{ secrets.PODROID_KEY_PASS }}
          PODROID_KEY_ALIAS: ${{ secrets.PODROID_KEY_ALIAS }}

      - name: GPG 签名 APK
        env:
          PODROID_GPG_PRIVATE_KEY: ${{ secrets.PODROID_GPG_PRIVATE_KEY }}
          PODROID_GPG_PASSPHRASE: ${{ secrets.PODROID_GPG_PASSPHRASE }}
        run: |
          if [ -z "$PODROID_GPG_PRIVATE_KEY" ]; then
            echo "无 GPG 密钥，跳过签名"
            exit 0
          fi

          APK_PATH=$(find app/build/outputs/apk -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "未找到 APK，跳过签名"
            exit 0
          fi

          APK_DIR=$(dirname "$APK_PATH")
          APK_NAME=$(basename "$APK_PATH")
          APK_BASE="${APK_NAME%.apk}"

          echo "$PODROID_GPG_PRIVATE_KEY" | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$PODROID_GPG_PASSPHRASE" \
              --detach-sign --armor \
              -o "$APK_DIR/$APK_BASE.apk.asc" \
              "$APK_PATH"
          sha256sum "$APK_PATH" > "$APK_DIR/$APK_BASE.apk.sha256"
          ls -la "$APK_DIR/"

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: podroid-apk
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/apk/**/*.apk.asc
            app/build/outputs/apk/**/*.apk.sha256
          if-no-files-found: error
          retention-days: 30
